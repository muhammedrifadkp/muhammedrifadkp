name: Daily Profile Refresh

on:
  schedule:
    # Runs daily at 17:30 UTC (11:00 PM IST)
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily refresh commits
        run: |
          git config user.name "muhammedrifadkp"
          git config user.email "muhammedrifadkp3@gmail.com"
          DATE=$(TZ="Asia/Kolkata" date "+%Y-%m-%d %H:%M:%S IST")
          for i in $(seq 1 12); do
            echo "{\"last_updated\": \"$DATE\", \"cycle\": $i}" > daily-status.json
            git add daily-status.json
            git commit -m "chore: daily profile status refresh ($i/12)"
          done
          git push

