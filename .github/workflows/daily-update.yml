name: Daily Profile Refresh

on:
  schedule:
    # Runs daily at 17:30 UTC (11:00 PM IST)
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily timestamp
        run: |
          DATE=$(TZ="Asia/Kolkata" date "+%Y-%m-%d %H:%M:%S IST")
          echo "{\"last_updated\": \"$DATE\"}" > daily-status.json

      - name: Commit and push changes
        run: |
          git config user.name "muhammedrifadkp"
          git config user.email "muhammedrifadkp3@gmail.com"
          git add daily-status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily profile status refresh" && git push)
